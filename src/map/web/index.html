<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>TPF3 Map Studio</title>

    <link rel="stylesheet" href="leaflet/leaflet.css">
    <link rel="stylesheet" href="css/style.css?v=5">

</head>

<body>

    
    <div id="map"></div>

    <div id="coordinate-readout"></div>

    <div id="layer-control">

        <div class="layer-title">Layer</div>

        <div class="layer-buttons">

            <button id="layers-on" title="Alle Ebenen im Panel einschalten">
                Alle
            </button>

            <button id="layers-off" title="Alle Ebenen im Panel ausschalten">
                Keine
            </button>

            <button id="export-json" title="Speichert die Objekte der Karte als JSON-Datei">
                <img class="btn-icon" src="icons/ui/json_export_hell.png" alt="">
                JSON Export
            </button>

            <button id="import-json" title="Lädt eine gespeicherte JSON-Datei auf die Karte">
                <img class="btn-icon" src="icons/ui/json_import_hell.png" alt="">
                JSON Import
            </button>

            <input
                type="file"
                id="json-file"
                accept=".json"
                style="display:none"
            >

        </div>

        <h4>Zeichnen</h4>

        <div id="draw-tools" class="layer-buttons">

            <button id="draw-road" title="Eigene Straße zeichnen: Punkte auf der Karte anklicken, dann Fertig">
                <img class="btn-icon" src="icons/ui/strassen_hell.png" alt="">
                Straße
            </button>

            <button id="draw-river" title="Eigenen Fluss zeichnen: Punkte auf der Karte anklicken, dann Fertig">
                <img class="btn-icon" src="icons/ui/fluesse_hell.png" alt="">
                Fluss
            </button>

            <button id="draw-building" title="Eigenes Gebäude zeichnen: Punkte auf der Karte anklicken, dann Fertig">
                <img class="btn-icon" src="icons/ui/gebaeude_hell.png" alt="">
                Gebäude
            </button>

            <button id="draw-finish" class="primary" title="Zeichnen beenden und das Objekt übernehmen">
                <img class="btn-icon" src="icons/ui/haken_weiss.png" alt="">
                Fertig
            </button>

        </div>

        <h4>Kartenquelle</h4>

        <label title="Normale Straßenkarte als Hintergrund">
            <input type="radio" name="base-layer" value="osm" checked>
            OpenStreetMap
        </label>

        <label title="Straßenkarte mit Schattenrelief">
            <input type="radio" name="base-layer" value="osm_relief">
            Karte + Relief
        </label>

        <label title="Legt die OpenRailwayMap über die Karte: Gleise, Bahnhöfe und Signale">
            <input type="checkbox" data-layer="openrailwaymap">
            <img class="lbl-icon" src="icons/ui/bahn_hell.png" alt="">
            Eisenbahnkarte (ORM)
        </label>

        <label title="Blendet ein Gitter über die Karte ein, mit dem sich Abstände und Größen abschätzen lassen">
            <input type="checkbox" data-layer="measurement-grid">
            <img class="lbl-icon" src="icons/ui/messen_hell.png" alt="">
            Maß-Gitter
        </label>

    </div>

    <!-- Qt WebChannel -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script> 
    
    <!-- Leaflet -->
    <script src="leaflet/leaflet.js"></script>

    <script src="js/layer_styles.js"></script>

    <script src="js/geometry_normalizer.js"></script>

    <script src="js/tpf2_reader.js"></script>

    <script src="js/tpf2_styles.js"></script>
    
    <script src="js/tpf2_adapter.js"></script>
    
    <script src="js/map_loader.js?v=3"></script>
    
    <script src="js/map_parser.js"></script>

    <script src="js/layer_manager.js"></script>

    <script src="js/layer_control.js"></script>

    <script src="js/info_panel.js"></script>

    <script src="js/export_manager.js"></script>

    <script src="js/import_manager.js"></script>

    <script src="js/draw_manager.js?v=2"></script>

    <script src="js/topology_manager.js"></script>

    <script src="js/geometry_editor.js"></script>

    <script src="js/grid.js"></script>

    <script src="js/relief_layer.js"></script>

    <script src="js/map.js?v=9"></script>

</body>

</html>
