<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>3D-Vorschau</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2430; font-family: sans-serif; }
  #bar { position: absolute; left: 8px; bottom: 8px; color: #dde; font-size: 12px;
         background: rgba(20,24,34,.7); padding: 4px 8px; border-radius: 4px; }
  #bar input { vertical-align: middle; width: 120px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="bar">Überhöhung <input id="exag" type="range" min="1" max="5" step="0.5" value="2"> <span id="exagv">2×</span></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/OrbitControls.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2430);
const camera = new THREE.PerspectiveCamera(45, 1, 10, 1e7);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(-1, 2, 1);
scene.add(sun);

let terrain = null, water = null, wall = null, floor = null;
let geoKey = "", exag = 2, baseHeights = null, minBase = 0, dim = 1, edges = [];

function b64(s, Type) {
  const bin = atob(s), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Type(buf.buffer);
}

function removeAll() {
  for (const m of [terrain, water, wall, floor]) {
    if (m) { scene.remove(m); m.geometry.dispose(); }
  }
  terrain = water = wall = floor = null;
}

function updateWalls() {
  const tp = terrain.geometry.attributes.position;
  const wp = wall.geometry.attributes.position;
  const floorY = Math.min(0, minBase * exag) - 0.1 * dim;
  let o = 0;
  for (const edge of edges) {
    const n = edge.length;
    for (let k = 0; k < n; k++) {
      const vi = edge[k], x = tp.getX(vi), z = tp.getZ(vi);
      wp.setXYZ(o + k, x, tp.getY(vi), z);
      wp.setXYZ(o + n + k, x, floorY, z);
    }
    o += 2 * n;
  }
  wp.needsUpdate = true;
  wall.geometry.computeVertexNormals();
  wall.geometry.computeBoundingSphere();
  floor.position.y = floorY;
  const top = -0.002 * dim;
  const depth = top - floorY;
  water.scale.y = depth;
  water.position.y = floorY + depth / 2;
}

function applyHeights() {
  if (!terrain || !baseHeights) return;
  const pos = terrain.geometry.attributes.position;
  for (let i = 0; i < baseHeights.length; i++) pos.setY(i, baseHeights[i] * exag);
  pos.needsUpdate = true;
  terrain.geometry.computeVertexNormals();
  terrain.geometry.computeBoundingSphere();
  updateWalls();
}

window.setMesh = function (p) {
  const rows = p.rows, cols = p.cols, cell = p.cell_m;
  baseHeights = b64(p.heights_b64, Float32Array);
  minBase = Infinity;
  for (let i = 0; i < baseHeights.length; i++) if (baseHeights[i] < minBase) minBase = baseHeights[i];
  const col8 = b64(p.colors_b64, Uint8Array);
  const key = rows + "x" + cols + "@" + cell;
  const first = !terrain;
  removeAll();

  const pos = new Float32Array(rows * cols * 3);
  const col = new Float32Array(rows * cols * 3);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    pos[i*3] = (c - (cols - 1) / 2) * cell;
    pos[i*3+2] = (r - (rows - 1) / 2) * cell;
    col[i*3] = col8[i*3] / 255; col[i*3+1] = col8[i*3+1] / 255; col[i*3+2] = col8[i*3+2] / 255;
  }
  const idx = new Uint32Array((rows - 1) * (cols - 1) * 6);
  let k = 0;
  for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
    const a = r * cols + c, b = a + 1, d = a + cols, e = d + 1;
    idx[k++] = a; idx[k++] = d; idx[k++] = b; idx[k++] = b; idx[k++] = d; idx[k++] = e;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  scene.add(terrain);

  const w = (cols - 1) * cell, h = (rows - 1) * cell;
  dim = Math.max(w, h);

  // Randwaende: oben Gelaenderand, unten Bodenplatte
  edges = [[], [], [], []];
  for (let c = 0; c < cols; c++) { edges[0].push(c); edges[1].push((rows - 1) * cols + c); }
  for (let r = 0; r < rows; r++) { edges[2].push(r * cols); edges[3].push(r * cols + cols - 1); }
  let total = 0;
  for (const e of edges) total += e.length;
  const widx = [];
  let o = 0;
  for (const e of edges) {
    const n = e.length;
    for (let j = 0; j < n - 1; j++) {
      const a = o + j, b = o + j + 1, c2 = o + n + j, d2 = o + n + j + 1;
      widx.push(a, c2, b, b, c2, d2);
    }
    o += 2 * n;
  }
  const wgeo = new THREE.BufferGeometry();
  wgeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(total * 2 * 3), 3));
  wgeo.setIndex(widx);
  const earth = new THREE.MeshLambertMaterial({ color: 0x6b4a36, side: THREE.DoubleSide });
  wall = new THREE.Mesh(wgeo, earth);
  scene.add(wall);

  floor = new THREE.Mesh(new THREE.PlaneGeometry(w, h), earth);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Wasser als Block (Aquarium): vom Boden bis zum Wasserspiegel
  water = new THREE.Mesh(
    new THREE.BoxGeometry(w * 0.996, 1, h * 0.996),
    new THREE.MeshLambertMaterial({ color: 0x2f5fd0, transparent: true, opacity: 0.55, depthWrite: false })
  );
  water.renderOrder = 1;
  scene.add(water);

  applyHeights();
  if (first || key !== geoKey) {
    camera.position.set(0, dim * 0.7, dim * 0.9);
    camera.near = dim / 1000; camera.far = dim * 20; camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
  }
  geoKey = key;
};

document.getElementById("exag").addEventListener("input", (e) => {
  exag = parseFloat(e.target.value);
  document.getElementById("exagv").textContent = exag + "×";
  applyHeights();
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
